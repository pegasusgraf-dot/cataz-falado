<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anunciador de Ofertas para Comércio</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --shadow: rgba(15, 23, 42, 0.12);
            --success: #16a34a;
            --success-dark: #15803d;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: var(--card);
            padding: 30px 28px;
            border-radius: 24px;
            box-shadow: 0 18px 50px var(--shadow);
            width: 100%;
            max-width: 620px;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        h2 {
            margin: 0 0 22px;
            color: var(--primary);
            text-align: center;
            font-size: clamp(1.7rem, 3vw, 2.4rem);
            letter-spacing: -0.03em;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text);
            font-size: 0.98rem;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #dbe3ef;
            border-radius: 12px;
            font-size: 16px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.26);
        }

        .secondary-btn {
            background: #eef2ff;
            color: var(--primary);
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .success-btn {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            color: white;
            box-shadow: 0 12px 26px rgba(22, 163, 74, 0.2);
        }

        .preview-box {
            margin-top: 24px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            padding: 18px 16px;
            border-radius: 16px;
            border-left: 6px solid var(--primary);
        }

        .preview-box h3 {
            margin: 0 0 12px;
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        #textoGerado {
            margin: 0;
            font-size: 1.12rem;
            line-height: 1.6;
            color: var(--text);
            font-weight: 500;
        }

        .status {
            margin-top: 12px;
            min-height: 24px;
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 600;
        }

        @media (min-width: 520px) {
            .button-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📢 Mega Oferta Express</h2>

        <div class="form-group">
            <label for="produto">Nome do Produto:</label>
            <input type="text" id="produto" placeholder="Ex: Arroz Tio João 5kg">
        </div>

        <div class="form-group">
            <label for="precoOriginal">Preço Original (R$):</label>
            <input type="number" step="0.01" id="precoOriginal" placeholder="Ex: 29.90">
        </div>

        <div class="form-group">
            <label for="precoPromo">Preço Promocional (R$):</label>
            <input type="number" step="0.01" id="precoPromo" placeholder="Ex: 21.90">
        </div>

        <div class="button-row">
            <button class="primary-btn" onclick="gerarEAnunciar()">Gerar anúncio</button>
            <button class="secondary-btn" onclick="ouvirUltimoTexto()">Ouvir novamente</button>
            <button class="success-btn" onclick="copiarTexto()" style="grid-column: 1 / -1;">Copiar anúncio</button>
        </div>

        <div class="preview-box">
            <h3>Texto do anúncio:</h3>
            <p id="textoGerado">Preencha os dados acima para gerar o anúncio...</p>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
    </div>

    <script>
        let ultimoTexto = '';

        function selecionarVozPTBR() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(voice =>
                voice.lang && (
                    voice.lang.toLowerCase().includes('pt-br') ||
                    voice.lang.toLowerCase().includes('pt')
                )
            ) || null;
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) {
                mostrarStatus('Seu navegador não suporta reprodução de voz.');
                return;
            }

            const synth = window.speechSynthesis;
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 1;

            const vozPTBR = selecionarVozPTBR();
            if (vozPTBR) {
                utterance.voice = vozPTBR;
            }

            synth.speak(utterance);
            mostrarStatus('Anúncio em reprodução...');
        }

        function mostrarStatus(mensagem) {
            const status = document.getElementById('status');
            status.textContent = mensagem;
        }

        function gerarEAnunciar() {
            const produto = document.getElementById('produto').value.trim();
            const precoOriginal = document.getElementById('precoOriginal').value.trim();
            const precoPromo = document.getElementById('precoPromo').value.trim();

            if (!produto || !precoOriginal || !precoPromo) {
                mostrarStatus('Por favor, preencha todos os campos antes de gerar o anúncio.');
                alert('Por favor, preencha todos os campos!');
                return;
            }

            const pOrig = Number(precoOriginal).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const pProm = Number(precoPromo).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const texto = `Atenção, cliente! Olha a oferta imperdível! ${produto}. De ${pOrig} por apenas ${pProm}. Aproveite agora no nosso comércio!`;
            ultimoTexto = texto;

            document.getElementById('textoGerado').innerText = texto;
            falarTexto(texto);
        }

        function ouvirUltimoTexto() {
            if (!ultimoTexto) {
                mostrarStatus('Ainda não há anúncio para ouvir.');
                return;
            }

            falarTexto(ultimoTexto);
        }

        async function copiarTexto() {
            if (!ultimoTexto) {
                mostrarStatus('Ainda não há anúncio para copiar.');
                return;
            }

            try {
                await navigator.clipboard.writeText(ultimoTexto);
                mostrarStatus('Texto copiado com sucesso!');
            } catch (error) {
                mostrarStatus('Não foi possível copiar automaticamente. Copie o texto manualmente.');
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                const voz = selecionarVozPTBR();
                if (voz) {
                    mostrarStatus('Voz PT-BR pronta para uso.');
                }
            };
        }
    </script>
</body>
</html>
