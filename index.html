<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Oferta Premium</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --success: #16a34a;
            --success-dark: #15803d;
            --shadow: rgba(15, 23, 42, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 18px 50px var(--shadow);
            padding: 28px 26px;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .tag {
            display: inline-block;
            background: #dbeafe;
            color: var(--primary);
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 2.8rem);
            color: var(--text);
        }

        .subtitle {
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.96rem;
        }

        .form-group {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text);
            font-size: 0.96rem;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid #dbe3ef;
            font-size: 1rem;
            background: #fff;
            transition: 0.2s ease;
        }

        input:focus {
            outline: none;
            border: 1.5px solid var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.25);
        }

        .primary-btn:hover {
            transform: translateY(-1px);
        }

        .secondary-btn {
            background: #eef2ff;
            color: var(--primary);
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .success-btn {
            width: 100%;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            color: white;
            box-shadow: 0 12px 26px rgba(22, 163, 74, 0.2);
        }

        .preview-box {
            margin-top: 22px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            border-left: 6px solid var(--primary);
            border-radius: 16px;
            padding: 18px 16px;
        }

        .preview-box h3 {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        #textoGerado {
            margin: 0;
            font-size: 1.08rem;
            line-height: 1.6;
            font-weight: 500;
            color: var(--text);
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .button-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="tag">Oferta do Dia</div>
            <h1>Loja Oferta Premium</h1>
            <div class="subtitle">Promoções irresistíveis para você aproveitar agora</div>
        </div>

        <div class="form-group">
            <label for="produto">Nome do Produto</label>
            <input type="text" id="produto" placeholder="Ex: Arroz Tio João 5kg">
        </div>

        <div class="form-group">
            <label for="precoOriginal">Preço Original (R$)</label>
            <input type="number" step="0.01" id="precoOriginal" placeholder="Ex: 29.90">
        </div>

        <div class="form-group">
            <label for="precoPromo">Preço Promocional (R$)</label>
            <input type="number" step="0.01" id="precoPromo" placeholder="Ex: 21.90">
        </div>

        <div class="button-row">
            <button class="primary-btn" onclick="gerarEAnunciar()">Gerar anúncio</button>
            <button class="secondary-btn" onclick="ouvirUltimoTexto()">Ouvir</button>
        </div>

        <button class="success-btn" onclick="copiarTexto()">Copiar anúncio</button>

        <div class="preview-box">
            <h3>Texto do anúncio</h3>
            <p id="textoGerado">Preencha os dados acima para gerar o anúncio...</p>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
    </div>

    <script>
        let ultimoTexto = '';

        function formatarPrecoParaLeitura(valor) {
            const numero = Number(valor);
            const inteiro = Math.trunc(numero);
            return `R$ ${inteiro.toLocaleString('pt-BR')}`;
        }

        function selecionarVozPTBR() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(voice =>
                voice.lang && (
                    voice.lang.toLowerCase().includes('pt-br') ||
                    voice.lang.toLowerCase().includes('pt')
                )
            ) || null;
        }

        function mostrarStatus(mensagem) {
            document.getElementById('status').textContent = mensagem;
        }

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) {
                mostrarStatus('Seu navegador não suporta reprodução de voz.');
                return;
            }

            const synth = window.speechSynthesis;
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.9;
            utterance.pitch = 1.08;
            utterance.volume = 1;

            const vozPTBR = selecionarVozPTBR();
            if (vozPTBR) {
                utterance.voice = vozPTBR;
            }

            synth.speak(utterance);
            mostrarStatus('Anúncio em reprodução...');
        }

        function gerarEAnunciar() {
            const produto = document.getElementById('produto').value.trim();
            const precoOriginal = document.getElementById('precoOriginal').value.trim();
            const precoPromo = document.getElementById('precoPromo').value.trim();

            if (!produto || !precoOriginal || !precoPromo) {
                mostrarStatus('Preencha todos os campos para continuar.');
                alert('Preencha todos os campos!');
                return;
            }

            const pOrigDisplay = Number(precoOriginal).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const pPromDisplay = Number(precoPromo).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const pOrigLeitura = formatarPrecoParaLeitura(precoOriginal);
            const pPromLeitura = formatarPrecoParaLeitura(precoPromo);

            const textoExibicao = `Atenção, cliente! Olha a oferta imperdível! ${produto}. De ${pOrigDisplay} por apenas ${pPromDisplay}. Aproveite agora no nosso comércio!`;
            const textoLeitura = `Atenção, cliente! Olha a oferta imperdível! ${produto}. De ${pOrigLeitura} por apenas ${pPromLeitura}. Aproveite agora no nosso comércio!`;

            ultimoTexto = textoExibicao;

            document.getElementById('textoGerado').innerText = textoExibicao;
            falarTexto(textoLeitura);
        }

        function ouvirUltimoTexto() {
            if (!ultimoTexto) {
                mostrarStatus('Ainda não há anúncio para ouvir.');
                return;
            }
            falarTexto(ultimoTexto.replace(/\$/g, 'reais').replace(/\./g, '').replace(/,/g, ''));
        }

        async function copiarTexto() {
            if (!ultimoTexto) {
                mostrarStatus('Ainda não há anúncio para copiar.');
                return;
            }

            try {
                await navigator.clipboard.writeText(ultimoTexto);
                mostrarStatus('Anúncio copiado com sucesso!');
            } catch (error) {
                mostrarStatus('Não foi possível copiar automaticamente.');
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                const voz = selecionarVozPTBR();
                if (voz) {
                    mostrarStatus('Voz em português pronta para uso.');
                }
            };
        }
    </script>
</body>
</html>
