<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SyncStore | Gerador de Anúncios</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --success: #16a34a;
        --success-dark: #15803d;
        --danger: #dc2626;
        --shadow: rgba(15, 23, 42, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #eef6ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .app-shell {
        width: 100%;
        max-width: 1280px;
        min-height: 760px;
        display: grid;
        grid-template-columns: 290px 1fr;
        border-radius: 28px;
        overflow: hidden;
        background: rgba(255,255,255,0.8);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .sidebar {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        border-right: 1px solid #e2e8f0;
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 1.3rem;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
      }

      .brand-period {
        color: var(--primary);
      }

      .nav-button {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: 14px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark));
        color: white;
        box-shadow: 0 12px 22px rgba(37, 99, 235, 0.25);
      }

      .nav-button.secondary {
        background: #eef2ff;
        color: var(--primary);
        border: 1px solid rgba(37, 99, 235, 0.15);
        box-shadow: none;
      }

      .sidebar-section {
        margin-top: 18px;
      }

      .sidebar-title {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
        font-weight: 800;
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .history-item {
        background: white;
        border: 1px solid #dfe7f2;
        border-radius: 12px;
        padding: 12px 12px;
        cursor: pointer;
        transition: 0.2s ease;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
      }

      .history-item:hover {
        border: 1px solid rgba(37, 99, 235, 0.25);
        background: #f8fbff;
      }

      .history-item strong {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 4px;
      }

      .history-item small {
        display: block;
        color: var(--muted);
        line-height: 1.5;
      }

      .main-panel {
        background: #fff;
        padding: 28px 32px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.7rem, 2vw, 2.4rem);
      }

      .empty-state {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .content-card {
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        border-radius: 20px;
        padding: 20px 22px;
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        margin-top: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-weight: 700;
        font-size: 0.96rem;
        color: var(--text);
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1.5px solid #d9e3ef;
        background: white;
        font-size: 1rem;
        transition: 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark));
        color: white;
        box-shadow: 0 12px 26px rgba(37, 99, 235, 0.25);
      }

      .primary-btn:hover { transform: translateY(-1px); }

      .secondary-btn {
        background: #eef2ff;
        color: var(--primary);
        border: 1px solid rgba(37, 99, 235, 0.15);
      }

      .success-btn {
        width: 100%;
        margin-top: 12px;
        background: linear-gradient(135deg, var(--success) 0%, var(--success-dark));
        color: white;
        box-shadow: 0 12px 26px rgba(22, 163, 74, 0.2);
      }

      .preview-box {
        margin-top: 20px;
        background: white;
        border-left: 6px solid var(--primary);
        border-radius: 16px;
        padding: 18px 16px;
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .preview-box h3 {
        margin: 0 0 12px;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #textoGerado {
        margin: 0;
        font-size: 1.08rem;
        line-height: 1.6;
        color: var(--text);
      }

      .status {
        margin-top: 14px;
        min-height: 24px;
        font-size: 0.92rem;
        color: var(--muted);
        font-weight: 700;
      }

      @media (max-width: 960px) {
        .app-shell {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .button-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div>
          <div class="brand">
            <span class="brand-mark">S</span>
            <span>SyncStore<span class="brand-period">.</span></span>
          </div>

          <button class="nav-button" id="btnAnunciosGerados">
            Anúncios gerados
          </button>

          <div class="sidebar-section">
            <div class="sidebar-title">Histórico</div>
            <div id="listaHistorico" class="history-list">
              <span class="empty-state">Nenhum anúncio gerado.</span>
            </div>
          </div>
        </div>

        <div>
          <button class="nav-button secondary" id="btnSair">
            Sair
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <div class="topbar">
          <div>
            <p class="eyebrow" style="margin:0; color: var(--muted); letter-spacing: .12em; font-size: .75rem; text-transform: uppercase; font-weight: 800;">
              Dashboard
            </p>
            <h1>Gerador de anúncios</h1>
          </div>
          <div style="background:#e0f2fe; color:#0f172a; border-radius:999px; padding:8px 12px; font-weight:800; font-size: .8rem;">
            Operador ativo
          </div>
        </div>

        <div class="content-card">
          <div class="form-grid">
            <div class="field">
              <label for="produto">Nome do produto</label>
              <input type="text" id="produto" placeholder="Ex: Arroz Tio João 5kg">
            </div>

            <div class="field">
              <label for="precoOriginal">Preço original (R$)</label>
              <input type="number" step="0.01" id="precoOriginal" placeholder="Ex: 29.90">
            </div>

            <div class="field">
              <label for="precoPromo">Preço promocional</label>
              <input type="number" step="0.01" id="precoPromo" placeholder="Ex: 21.90">
            </div>

            <div class="button-row">
              <button class="primary-btn" onclick="gerarEAnunciar()">Gerar anúncio</button>
              <button class="secondary-btn" onclick="ouvirUltimoTexto()">Ouvir</button>
            </div>

            <button class="success-btn" onclick="copiarTexto()">Copiar anúncio</button>

            <div class="preview-box">
              <h3>Texto do anúncio</h3>
              <p id="textoGerado">Preencha os dados acima para gerar o anúncio...</p>
            </div>

            <div id="status" class="status" aria-live="polite"></div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const historico = [];
      const STORAGE_KEY = 'syncstore_anuncios';
      let ultimoTexto = '';

      function formatarMoeda(valor) {
        return Number(valor).toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });
      }

      function mostrarStatus(mensagem) {
        document.getElementById('status').textContent = mensagem;
      }

      function carregarHistorico() {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          document.getElementById('listaHistorico').innerHTML = '<span class=\"empty-state\">Nenhum anúncio gerado.</span>';
          return;
        }

        try {
          const items = JSON.parse(saved);
          if (!items.length) {
            document.getElementById('listaHistorico').innerHTML = '<span class=\"empty-state\">Nenhum anúncio gerado.</span>';
            return;
          }

          document.getElementById('listaHistorico').innerHTML = '';
          items.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'history-item';
            el.innerHTML = `
              <strong>${item.produto || 'Produto'}</strong>
              <small>${item.texto || 'Sem texto'}</small>
            `;

            el.addEventListener('click', () => {
              const texto = item.texto || '';
              document.getElementById('textoGerado').innerText = texto;
              ultimoTexto = texto;
              mostrarStatus('Anúncio carregado do histórico.');
              falarTexto(texto);
            });

            document.getElementById('listaHistorico').appendChild(el);
          });
        } catch (error) {
          document.getElementById('listaHistorico').innerHTML = '<span class=\"empty-state\">Nenhum anúncio gerado.</span>';
        }
      }

      function salvarHistorico(item) {
        const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        items.unshift(item);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items.slice(0, 20)));
        carregarHistorico();
      }

      function selecionarVozPTBR() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(voice =>
          voice.lang && (
            voice.lang.toLowerCase().includes('pt-br') ||
            voice.lang.toLowerCase().includes('pt')
          )
        ) || null;
      }

      function falarTexto(texto) {
        if (!('speechSynthesis' in window)) {
          mostrarStatus('Seu navegador não suporta reprodução de voz.');
          return;
        }

        const synth = window.speechSynthesis;
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9;
        utterance.pitch = 1.08;
        utterance.volume = 1;

        const vozPTBR = selecionarVozPTBR();
        if (vozPTBR) {
          utterance.voice = vozPTBR;
        }

        synth.speak(utterance);
        mostrarStatus('Anúncio em reprodução...');
      }

      function gerarEAnunciar() {
        const produto = document.getElementById('produto').value.trim();
        const precoOriginal = document.getElementById('precoOriginal').value.trim();
        const precoPromo = document.getElementById('precoPromo').value.trim();

        if (!produto || !precoOriginal || !precoPromo) {
          mostrarStatus('Preencha todos os campos para continuar.');
          alert('Preencha todos os campos!');
          return;
        }

        const pOrig = Number(precoOriginal);
        const pProm = Number(precoPromo);

        const texto = `Atenção, cliente! Olha a oferta imperdível! ${produto}. De ${formatarMoeda(pOrig)} por apenas ${formatarMoeda(pProm)}. Aproveite! Supermercados Ponto Novo, onde e gostoso comprar.`;

        ultimoTexto = texto;

        document.getElementById('textoGerado').innerText = texto;

        const novoItem = {
          produto,
          texto,
          createdAt: new Date().toISOString()
        };

        salvarHistorico(novoItem);
        mostrarStatus('Anúncio gerado com sucesso!');
        falarTexto(texto);
      }

      function ouvirUltimoTexto() {
        if (!ultimoTexto) {
          mostrarStatus('Ainda não há anúncio para ouvir.');
          return;
        }

        falarTexto(ultimoTexto);
      }

      async function copiarTexto() {
        if (!ultimoTexto) {
          mostrarStatus('Ainda não há anúncio para copiar.');
          return;
        }

        try {
          await navigator.clipboard.writeText(ultimoTexto);
          mostrarStatus('Anúncio copiado com sucesso!');
        } catch (error) {
          mostrarStatus('Não foi possível copiar automaticamente.');
        }
      }

      document.getElementById('btnAnunciosGerados').addEventListener('click', () => {
        const container = document.getElementById('listaHistorico');
        const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        if (!items.length) {
          container.innerHTML = '<span class=\"empty-state\">Nenhum anúncio gerado.</span>';
          mostrarStatus('Nenhum anúncio gerado até o momento.');
          return;
        }

        container.innerHTML = '';

        items.forEach((item) => {
          const el = document.createElement('div');
          el.className = 'history-item';
          el.innerHTML = `
            <strong>${item.produto || 'Produto'}</strong>
            <small>${item.texto || 'Sem texto'}</small>
          `;

          el.addEventListener('click', () => {
            document.getElementById('textoGerado').innerText = item.texto;
            ultimoTexto = item.texto;
            mostrarStatus('Anúncio carregado do histórico.');
            falarTexto(item.texto);
          });

          container.appendChild(el);
        });
      });

      document.getElementById('btnSair').addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        window.location.reload();
      });

      window.addEventListener('load', () => {
        carregarHistorico();
      });

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          const voz = selecionarVozPTBR();
          if (voz) {
            mostrarStatus('Voz em português pronta para uso.');
          }
        };
      }
    </script>
  </body>
</html>
