<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Oferta SyncStore - Login</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --success: #16a34a;
            --success-dark: #15803d;
            --shadow: rgba(15, 23, 42, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 18px 50px var(--shadow);
            padding: 32px 26px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            transition: max-width 0.3s ease;
        }

        .container.app-view {
            max-width: 620px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .tag {
            display: inline-block;
            background: #dbeafe;
            color: var(--primary);
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            color: var(--text);
        }

        .subtitle {
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.96rem;
        }

        .form-group {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text);
            font-size: 0.96rem;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid #dbe3ef;
            font-size: 1rem;
            background: #fff;
            transition: 0.2s ease;
        }

        input:focus {
            outline: none;
            border: 1.5px solid var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.25);
            width: 100%;
            margin-top: 18px;
        }

        .primary-btn:hover {
            transform: translateY(-1px);
        }

        .secondary-btn {
            background: #eef2ff;
            color: var(--primary);
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .success-btn {
            width: 100%;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            color: white;
            box-shadow: 0 12px 26px rgba(22, 163, 74, 0.2);
        }

        .preview-box {
            margin-top: 22px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            border-left: 6px solid var(--primary);
            border-radius: 16px;
            padding: 18px 16px;
        }

        .preview-box h3 {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        #textoGerado {
            margin: 0;
            font-size: 1.08rem;
            line-height: 1.6;
            font-weight: 500;
            color: var(--text);
        }

        .history-section {
            margin-top: 24px;
        }

        .history-section h3 {
            font-size: 0.9rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .history-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background: #e2e8f0;
            border-color: var(--primary);
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 600;
            text-align: center;
        }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .button-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="mainContainer" class="container">
        <!-- TELA DE LOGIN -->
        <div id="loginView">
            <div class="brand">
                <div class="tag">Restrito</div>
                <h1>Acesso ao Sistema</h1>
                <div class="subtitle">Entre ou cadastre seu usuário</div>
            </div>

            <div class="form-group">
                <label for="usuarioLogin">Usuário</label>
                <input type="text" id="usuarioLogin" placeholder="Ex: Paulo">
            </div>

            <div class="form-group">
                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" placeholder="Sua senha">
            </div>

            <button class="primary-btn" onclick="fazerLogin()">Entrar / Cadastrar</button>
        </div>

        <!-- TELA DO GERADOR DE ANÚNCIOS (DASHBOARD) -->
        <div id="appView" class="hidden">
            <div class="brand" style="margin-bottom: 15px;">
                <div class="tag">Oferta do Dia</div>
                <h1>Loja Oferta SyncStore</h1>
                <div class="subtitle" id="boasVindasUsuario">Promoções irresistíveis para você</div>
            </div>

            <div class="form-group">
                <label for="produto">Nome do Produto</label>
                <input type="text" id="produto" placeholder="Ex: Arroz Tio João 5kg">
            </div>

            <div class="form-group">
                <label for="precoOriginal">Preço Original (R$)</label>
                <input type="number" step="0.01" id="precoOriginal" placeholder="Ex: 29.90">
            </div>

            <div class="form-group">
                <label for="precoPromo">Preço Promocional (R$)</label>
                <input type="number" step="0.01" id="precoPromo" placeholder="Ex: 21.90">
            </div>

            <div class="form-group">
                <label for="textoExtra">Texto Extra (opcional)</label>
                <input type="text" id="textoExtra" placeholder="Ex: Entrega rápida e com garantia hoje">
            </div>

            <div class="button-row">
                <button class="primary-btn" style="margin-top: 0;" onclick="gerarEAnunciar()">Gerar anúncio</button>
                <button class="secondary-btn" onclick="ouvirUltimoTexto()">Ouvir</button>
            </div>

            <button class="success-btn" onclick="copiarTexto()">Copiar anúncio</button>

            <div class="preview-box">
                <h3>Texto do anúncio</h3>
                <p id="textoGerado">Preencha os dados acima para gerar o anúncio...</p>
            </div>

            <div class="history-section">
                <h3>Anúncios Gerados Hoje (Clique para repetir)</h3>
                <div id="listaHistorico" class="history-list">
                    <span style="color: var(--muted); font-size: 0.85rem;">Nenhum anúncio gerado ainda.</span>
                </div>
            </div>

            <button class="secondary-btn" style="width: 100%; margin-top: 18px;" onclick="fazerLogout()">Sair / Trocar Usuário</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
    </div>

    <script>
        let ultimoTexto = '';
        let ultimoTextoLeitura = '';
        let historicoAnuncios = JSON.parse(sessionStorage.getItem('historicoAnuncios')) || [];

        const usuarioLogado = sessionStorage.getItem('usuarioLogado');
        if (usuarioLogado) {
            ativarDashboard(usuarioLogado);
        }

        async function fazerLogin() {
            const usuario = document.getElementById('usuarioLogin').value.trim();
            if (!usuario) {
                mostrarStatus('Informe o nome de usuário.');
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario })
                });
                const data = await response.json();

                if (data.sucesso) {
                    sessionStorage.setItem('usuarioLogado', data.usuario.nome);
                    ativarDashboard(data.usuario.nome);
                } else {
                    mostrarStatus('Erro ao entrar.');
                }
            } catch (error) {
                mostrarStatus('Erro de conexão com o servidor.');
            }
        }

        function ativarDashboard(nome) {
            document.getElementById('loginView').classList.add('hidden');
            const appView = document.getElementById('appView');
            appView.classList.remove('hidden');
            document.getElementById('mainContainer').classList.add('app-view');
            document.getElementById('boasVindasUsuario').textContent = `Bem-vindo, ${nome}! Banco Neon sincronizado.`;
            renderizarHistorico();
            mostrarStatus('');
        }

        function fazerLogout() {
            sessionStorage.removeItem('usuarioLogado');
            document.getElementById('appView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('mainContainer').classList.remove('app-view');
            document.getElementById('usuarioLogin').value = '';
            document.getElementById('senhaLogin').value = '';
            mostrarStatus('Sessão encerrada.');
        }

        function removerMoedaParaLeitura(valor) {
            const numero = Number(valor);
            if (!Number.isFinite(numero)) return '0';
            const [inteiro, centavos] = numero.toFixed(2).split('.');
            const partes = [];
            if (Number(inteiro) > 0) partes.push(inteiro);
            if (Number(centavos) > 0) partes.push(centavos);
            return partes.join(' e ');
        }

        function selecionarVozPTBR() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(voice =>
                voice.lang && (
                    voice.lang.toLowerCase().includes('pt-br') ||
                    voice.lang.toLowerCase().includes('pt')
                )
            ) || null;
        }

        function mostrarStatus(mensagem) {
            document.getElementById('status').textContent = mensagem;
        }

        function falarTexto(textoExibicao, textoLeituraPersonalizada) {
            if (!('speechSynthesis' in window)) {
                mostrarStatus('Seu navegador não suporta reprodução de voz.');
                return;
            }

            const synth = window.speechSynthesis;
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(textoLeituraPersonalizada);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.9;
            utterance.pitch = 1.08;
            utterance.volume = 1;

            const vozPTBR = selecionarVozPTBR();
            if (vozPTBR) {
                utterance.voice = vozPTBR;
            }

            synth.speak(utterance);
            mostrarStatus('Anúncio em reprodução...');
        }

        function gerarEAnunciar() {
            const produto = document.getElementById('produto').value.trim();
            const precoOriginal = document.getElementById('precoOriginal').value.trim();
            const precoPromo = document.getElementById('precoPromo').value.trim();
            const textoExtra = document.getElementById('textoExtra').value.trim();

            if (!produto || !precoOriginal || !precoPromo) {
                mostrarStatus('Preencha todos os campos para continuar.');
                alert('Preencha todos os campos!');
                return;
            }

            const pOrigDisplay = Number(precoOriginal).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const pPromDisplay = Number(precoPromo).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const pOrigLeitura = removerMoedaParaLeitura(precoOriginal);
            const pPromLeitura = removerMoedaParaLeitura(precoPromo);
            const textoExtraDisplay = textoExtra ? ` ${textoExtra}` : '';
            const textoExtraLeitura = textoExtra ? ` ${textoExtra}` : '';

            const textoExibicao = `Atenção, cliente! Olha a oferta imperdível! ${produto}. De ${pOrigDisplay} por apenas ${pPromDisplay}.${textoExtraDisplay} Aproveite! Supermercados Ponto Novo, Onde é gostoso Comprar.`;
            const textoLeitura = `Atenção, cliente! Olha a oferta imperdível! ${produto}. De ${pOrigLeitura} por apenas ${pPromLeitura}.${textoExtraLeitura} Aproveite! Supermercados Ponto Novo, Onde é gostoso Comprar.`;

            ultimoTexto = textoExibicao;
            ultimoTextoLeitura = textoLeitura;

            document.getElementById('textoGerado').innerText = textoExibicao;
            falarTexto(textoExibicao, textoLeitura);

            const novoItem = { 
                produto, 
                textoExibicao, 
                textoLeitura, 
                hora: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) 
            };
            
            historicoAnuncios.unshift(novoItem);
            if (historicoAnuncios.length > 20) historicoAnuncios.pop();
            sessionStorage.setItem('historicoAnuncios', JSON.stringify(historicoAnuncios));
            renderizarHistorico();
        }

        function repetirAnuncio(index) {
            const item = historicoAnuncios[index];
            if (item) {
                ultimoTexto = item.textoExibicao;
                ultimoTextoLeitura = item.textoLeitura;
                document.getElementById('textoGerado').innerText = item.textoExibicao;
                falarTexto(item.textoExibicao, item.textoLeitura);
            }
        }

        function renderizarHistorico() {
            const container = document.getElementById('listaHistorico');
            if (historicoAnuncios.length === 0) {
                container.innerHTML = '<span style="color: var(--muted); font-size: 0.85rem;">Nenhum anúncio gerado ainda.</span>';
                return;
            }

            container.innerHTML = historicoAnuncios.map((item, index) => `
                <div class="history-item" onclick="repetirAnuncio(${index})" title="Clique para repetir o anúncio">
                    <span><strong>${item.produto}</strong> (${item.hora})</span>
                    <span style="font-size: 0.8rem; color: var(--primary); font-weight: 600;">Ouvir 🔊</span>
                </div>
            `).join('');
        }

        function ouvirUltimoTexto() {
            if (!ultimoTextoLeitura) {
                mostrarStatus('Ainda não há anúncio para ouvir.');
                return;
            }
            falarTexto(ultimoTexto, ultimoTextoLeitura);
        }

        async function copiarTexto() {
            if (!ultimoTexto) {
                mostrarStatus('Ainda não há anúncio para copiar.');
                return;
            }

            try {
                await navigator.clipboard.writeText(ultimoTexto);
                mostrarStatus('Anúncio copiado com sucesso!');
            } catch (error) {
                mostrarStatus('Não foi possível copiar automaticamente.');
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                const voz = selecionarVozPTBR();
                if (voz) {
                    mostrarStatus('Voz em português pronta para uso.');
                }
            };
        }
    </script>
</body>
</html>
